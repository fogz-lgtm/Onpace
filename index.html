/* ============ math ============ */
function computeTargets(p, workoutCals) {
  const kg = p.weightLb * 0.4536;
  const cm = (p.heightFt * 12 + Number(p.heightIn)) * 2.54;
  const bmr = 10 * kg + 6.25 * cm - 5 * p.age + (p.sex === "male" ? 5 : -161);
  const baseTdee = bmr * 1.35;
  const floor = p.sex === "male" ? 1500 : 1200;
  const calories = Math.max(Math.round(baseTdee + workoutCals - p.rateLbWk * 500), floor);
  const protein = Math.round(p.weightLb * 0.9);
  const fat = Math.round(p.weightLb * 0.32);
  const carbs = Math.max(Math.round((calories - protein * 4 - fat * 9) / 4), 0);
  return { calories, protein, fat, carbs };
}

/* ============ AI via proxy ============ */
async function askClaude(prompt, maxTokens = 1000, timeoutMs = 60000, imageBase64 = null) {
  const apiKey = getApiKey();
  if (!apiKey) throw new Error("AI not configured — add your Anthropic API key in the You tab");
  const content = imageBase64
    ? [{ type: "image", source: { type: "base64", media_type: "image/jpeg", data: imageBase64 } }, { type: "text", text: prompt }]
    : prompt;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  let data;
  try {
    const res = await fetch(ANTHROPIC_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: maxTokens,
        messages: [{ role: "user", content }],
      }),
      signal: ctrl.signal,
    });
    data = await res.json();
  } catch (e) {
    if (e.name === "AbortError") throw new Error(`Timed out after ${Math.round(timeoutMs / 1000)}s`);
    throw e;
  } finally { clearTimeout(timer); }
  if (data.error) throw new Error(data.error.message || "AI request failed");
  return (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n").replace(/```json|```/g, "").trim();
}

/* ============ Strava — your own (free) Strava API app's credentials live in
   this browser's localStorage (You tab → Strava), never in this file ============ */
const STRAVA_AUTH = "https://www.strava.com/oauth/authorize";
const STRAVA_TOKEN = "https://www.strava.com/oauth/token";
const STRAVA_API = "https://www.strava.com/api/v3";

async function stravaToken(params) {
  const res = await fetch(STRAVA_TOKEN, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(params),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.message || "Strava auth failed");
  return data;
}

async function stravaAccess(s, updateStrava) {
  if (s.expiresAt && s.expiresAt * 1000 > Date.now() + 60000) return s.accessToken;
  const d = await stravaToken({ client_id: s.clientId, client_secret: s.clientSecret, grant_type: "refresh_token", refresh_token: s.refreshToken });
  updateStrava({ ...s, accessToken: d.access_token, refreshToken: d.refresh_token, expiresAt: d.expires_at });
  return d.access_token;
}

function parseJson(text) {
  try { return JSON.parse(text); } catch {
    const m = text.match(/[\[{][\s\S]*[\]}]/);
    if (m) { try { return JSON.parse(m[0]); } catch { return null; } }
    return null;
  }
}

function fileToJpegBase64(file, maxDim = 1100) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("read failed"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("decode failed"));
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.82).split(",")[1]);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ============ storage: localStorage ============ */
function loadKey(key, fallback) {
  try {
    const v = localStorage.getItem("onpace:" + key);
    return v ? JSON.parse(v) : fallback;
  } catch { return fallback; }
}
function saveKey(key, value) {
  try {
    localStorage.setItem("onpace:" + key, JSON.stringify(value));
    return true;
  } catch (e) { console.error(e); return false; }
}

};

function RingSvg({ size, stroke, value, target, color, track, children }) {
  const r = (size - stroke) / 2;
  const circ = 2 * Math.PI * r;
  const pct = Math.min(value / Math.max(target, 1), 1);
  return (
    <div style={{ position: "relative", width: size, height: size, flexShrink: 0 }}>
      <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={track} strokeWidth={stroke} />
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="round"
          strokeDasharray={circ} strokeDashoffset={circ * (1 - pct)}
          style={{ transition: "stroke-dashoffset 0.6s cubic-bezier(0.2,0.8,0.2,1)" }} />
      </svg>
      <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>{children}</div>
    </div>
  );
}

function Hero({ name, targets, eaten, macros, trainingCals }) {

  return (

/* ============ app ============ */
function App() {
  const [tab, setTab] = useState("today");
  const [profile, setProfile] = useState(DEFAULT_PROFILE);
  const [log, setLog] = useState({ meals: [], workouts: [] });
  const [library, setLibrary] = useState([]);
  const [plan, setPlan] = useState(null);
  const [prefs, setPrefs] = useState(DEFAULT_PREFS);
  const [apiKey, setApiKey] = useState("");
  const [strava, setStrava] = useState(null);
  const [stravaMsg, setStravaMsg] = useState("");
  const [firstRun, setFirstRun] = useState(false);
  const [date, setDate] = useState(todayKey());
  const aiReady = !!apiKey.trim();

  // live midnight rollover
  useEffect(() => {
    const check = () => {
      const nd = todayKey();
      if (nd !== date) {
        setDate(nd);
        setLog(loadKey(`log:${nd}`, { meals: [], workouts: [] }));
      }
    };
    const iv = setInterval(check, 30000);
    const onVis = () => { if (document.visibilityState === "visible") check(); };
    document.addEventListener("visibilitychange", onVis);
    return () => { clearInterval(iv); document.removeEventListener("visibilitychange", onVis); };
  }, [date]);

  useEffect(() => {
    const p = loadKey("profile", null);
    if (p) setProfile({ ...DEFAULT_PROFILE, ...p }); else { setFirstRun(true); setTab("settings"); }
    setLog(loadKey(`log:${date}`, { meals: [], workouts: [] }));
    setLibrary(loadKey("library", []));
    setPlan(loadKey("plan-current", null));
    setPrefs(loadKey("plan-prefs", DEFAULT_PREFS));
    setApiKey(loadKey("apikey", ""));
    setStrava(loadKey("strava", null));
  }, []);

  // Strava OAuth callback (?code= after the user approves on strava.com)
  useEffect(() => {
    const q = new URLSearchParams(window.location.search);
    const code = q.get("code");
    const oauthErr = q.get("error");
    if (!code && !oauthErr) return;
    window.history.replaceState({}, "", window.location.pathname);
    setTab("settings");
    if (oauthErr) { setStravaMsg("Strava connection was cancelled."); return; }
    const s = loadKey("strava", null);
    if (!s || !s.clientId || !s.clientSecret) { setStravaMsg("Strava credentials missing — enter them and tap Connect again."); return; }
    stravaToken({ client_id: s.clientId, client_secret: s.clientSecret, code, grant_type: "authorization_code" })
      .then((d) => {
        updateStrava({
          ...s, accessToken: d.access_token, refreshToken: d.refresh_token, expiresAt: d.expires_at,
          athlete: d.athlete ? `${d.athlete.firstname || ""} ${d.athlete.lastname || ""}`.trim() : "",
        });
        setStravaMsg("Connected to Strava.");
      })
      .catch((e) => setStravaMsg(`Strava connect failed — ${e.message}`));
  }, []);

  const workoutCals = log.workouts.reduce((s, w) => s + (Number(w.calories) || 0), 0);
  const targets = useMemo(() => computeTargets(profile, workoutCals), [profile, workoutCals]);
  const eaten = log.meals.reduce((s, m) => s + (Number(m.calories) || 0), 0);
  const macros = {
    protein: log.meals.reduce((s, m) => s + (Number(m.protein_g) || 0), 0),
    carbs: log.meals.reduce((s, m) => s + (Number(m.carbs_g) || 0), 0),
    fat: log.meals.reduce((s, m) => s + (Number(m.fat_g) || 0), 0),
  };

  const updateLog = (n) => { setLog(n); saveKey(`log:${date}`, n); };
  const updateLibrary = (n) => { setLibrary(n); saveKey("library", n); };
  const updateProfile = (n) => { setProfile(n); saveKey("profile", n); };
  const updatePlan = (n) => { setPlan(n); saveKey("plan-current", n); };
  const updatePrefs = (n) => { setPrefs(n); saveKey("plan-prefs", n); };
  const updateApiKey = (n) => { setApiKey(n); saveKey("apikey", n); };
  const updateStrava = (n) => { setStrava(n); saveKey("strava", n); };

  // Strava sync — reads today's log from storage so auto-sync can never write
  // into a stale day, and dedupes by activity id so repeat runs are safe
  const syncBusy = useRef(false);
  const doStravaSync = async () => {
    if (syncBusy.current) return { added: 0 };
    syncBusy.current = true;
    try {
      const s = loadKey("strava", null);
      if (!s || !s.refreshToken) return { added: 0 };
      const token = await stravaAccess(s, updateStrava);
      const start = new Date(); start.setHours(0, 0, 0, 0);
      const res = await fetch(`${STRAVA_API}/athlete/activities?after=${Math.floor(start.getTime() / 1000)}&per_page=30`, { headers: { Authorization: `Bearer ${token}` } });
      const acts = await res.json();
      if (!res.ok) throw new Error(acts.message || "couldn't list activities");
      const dk = todayKey();
      const cur = loadKey(`log:${dk}`, { meals: [], workouts: [] });
      const have = new Set(cur.workouts.map((w) => w.strava_id).filter(Boolean));
      const added = [];
      for (const a of acts) {
        if (have.has(a.id)) continue;
        const dRes = await fetch(`${STRAVA_API}/activities/${a.id}`, { headers: { Authorization: `Bearer ${token}` } });
        const det = await dRes.json();
        const cals = Math.round((dRes.ok && det.calories) || a.kilojoules || 0);
        if (!cals) continue;
        added.push({ id: a.id, strava_id: a.id, name: a.name, sport: a.sport_type, duration_min: Math.round(a.moving_time / 60), calories: cals, source: "Strava" });
      }
      if (added.length) {
        const next = { ...cur, workouts: [...cur.workouts, ...added] };
        saveKey(`log:${dk}`, next);
        if (dk === date) setLog(next);
      }
      return { added: added.length };
    } finally { syncBusy.current = false; }
  };
  const syncRef = useRef(null);
  syncRef.current = doStravaSync;

  // auto-sync: on launch/connect, on returning to the app, and every few minutes while open
  const lastAutoSync = useRef(0);
  const stravaOn = !!(strava && strava.refreshToken);
  useEffect(() => {
    if (!stravaOn) return;
    const auto = () => {
      if (document.visibilityState !== "visible") return;
      if (Date.now() - lastAutoSync.current < 5 * 60 * 1000) return;
      lastAutoSync.current = Date.now();
      // small delay so the midnight-rollover check settles first
      setTimeout(() => { if (syncRef.current) syncRef.current().catch(() => {}); }, 400);
    };
    auto();
    document.addEventListener("visibilitychange", auto);
    const iv = setInterval(auto, 60000);
    return () => { document.removeEventListener("visibilitychange", auto); clearInterval(iv); };
  }, [stravaOn]);

  return (
    <div style={{ minHeight: "100vh", background: C.bg, color: C.ink, fontFamily: F.body, paddingBottom: 92, paddingTop: "env(safe-area-inset-top)" }}>
      {/* dark strip behind the iPhone status bar so its white text stays readable */}
      <div style={{ position: "fixed", top: 0, left: 0, right: 0, height: "env(safe-area-inset-top)", background: C.forest, zIndex: 10 }} />
      <header style={{ padding: "20px 18px 12px", maxWidth: 560, margin: "0 auto", display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
        <div style={{ fontFamily: F.display, fontWeight: 800, fontSize: 22 }}>On<span style={{ color: C.pine }}>Pace</span></div>
        <div style={{ fontSize: 13, fontWeight: 500, color: C.faint }}>
          {new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" })}
        </div>
      </header>

      {!aiReady && (
        <div style={{ maxWidth: 560, margin: "0 auto", padding: "0 16px" }}>
          <Card style={{ background: C.amberSoft, border: "none" }}>
            <div style={{ fontSize: 13, color: C.amberDeep, fontWeight: 600, lineHeight: 1.5 }}>
              AI features are off — add your Anthropic API key in the You tab (one-time, stays on this device).
              Logging from your Library and manual entry still work.
            </div>
          </Card>
        </div>
      )}

      <main style={{ padding: "0 16px", maxWidth: 560, margin: "0 auto" }}>
        {tab === "today" && <TodayTab {...{ profile, targets, eaten, macros, log, updateLog, library, updateLibrary, aiReady, stravaOn, syncStrava: doStravaSync }} />}
        {tab === "suggest" && <SuggestTab {...{ profile, targets, eaten, macros, log, updateLog, library, updateLibrary, aiReady }} />}
        {tab === "plan" && <PlanTab {...{ profile, targets, plan, updatePlan, aiReady, prefs, updatePrefs }} />}
        {tab === "library" && <LibraryTab {...{ library, updateLibrary, log, updateLog }} />}
        {tab === "settings" && (
          <SettingsTab {...{ profile, updateProfile, firstRun, apiKey, updateApiKey, strava, updateStrava, stravaMsg }} done={() => { setFirstRun(false); setTab("today"); }}
            appData={{ profile, log, library, plan, prefs }}
            onRestore={(d) => {
              if (d.profile) updateProfile({ ...DEFAULT_PROFILE, ...d.profile });
              if (d.log) updateLog({ meals: d.log.meals || [], workouts: d.log.workouts || [] });
              if (d.library) updateLibrary(d.library);
              if (d.plan) updatePlan(d.plan);
              if (d.prefs) updatePrefs(d.prefs);
            }} />
        )}
      </main>

      <nav style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: C.forest, borderTop: "1px solid rgba(155,220,176,0.15)", boxShadow: "0 -8px 30px rgba(15,36,27,0.25)", paddingBottom: "env(safe-area-inset-bottom)" }}>
        <div style={{ display: "flex", maxWidth: 560, margin: "0 auto" }}>
          {[["today", "Today", "flame"], ["suggest", "Suggest", "spark"], ["plan", "Plan", "calendar"], ["library", "Library", "bookmark"], ["settings", "You", "sliders"]].map(([k, label, ic]) => {
            const active = tab === k;
            return (
              <button key={k} onClick={() => setTab(k)} style={{
                flex: 1, padding: "12px 0 14px", background: "transparent", border: "none", cursor: "pointer",
                display: "flex", flexDirection: "column", alignItems: "center", gap: 4,
                color: active ? C.mint : "rgba(255,255,255,0.55)",
              }}>
                <Icon d={ICONS[ic]} size={21} sw={active ? 2.1 : 1.7} />
                <span style={{ fontSize: 10.5, fontWeight: active ? 700 : 500 }}>{label}</span>
              </button>
            );
          })}
        </div>
      </nav>
    </div>
  );
}

/* ============ Today ============ */
function TodayTab({ profile, targets, eaten, macros, log, updateLog, library, updateLibrary, aiReady, stravaOn, syncStrava }) {
  const [mealText, setMealText] = useState("");
  const [estimating, setEstimating] = useState(false);
  const [estimate, setEstimate] = useState(null);
  const [error, setError] = useState("");
  const [manualOpen, setManualOpen] = useState(false);
  const [wCal, setWCal] = useState("");
  const [syncing, setSyncing] = useState(false);
  const [trainMsg, setTrainMsg] = useState("");

  const syncNow = async () => {
    setSyncing(true); setTrainMsg("");
    try {
      const r = await syncStrava();
      setTrainMsg(r.added ? `Added ${r.added} workout${r.added === 1 ? "" : "s"} from Strava.` : "Up to date — no new Strava workouts today.");
    } catch (e) { setTrainMsg(`Strava sync failed — ${e.message}`); }
    setSyncing(false);
  };

  const kitchen = profile.kitchenNotes?.trim()
    ? `\nStanding kitchen facts — always apply these when relevant: ${profile.kitchenNotes.trim()}` : "";

  const estimateMeal = async () => {
    if (!mealText.trim()) return;
    setEstimating(true); setError(""); setEstimate(null);
    try {
      const text = await askClaude(`Estimate nutrition for this meal as eaten (typical restaurant/cafeteria portions unless stated): "${mealText}".${kitchen}\nRespond ONLY with JSON: {"name": short name, "calories": number, "protein_g": number, "carbs_g": number, "fat_g": number}. No other text.`);
      const j = parseJson(text);
      if (j && j.calories != null) setEstimate(j);
      else setError("Couldn't estimate that — try rewording it.");
    } catch (e) { setError(`Estimate failed — ${e.message}`); }
    setEstimating(false);
  };

  const estimatePhoto = async (file) => {
    if (!file) return;
    setEstimating(true); setError(""); setEstimate(null);
    try {
      const b64 = await fileToJpegBase64(file);
      const text = await askClaude(`This photo shows either a meal/food or a nutrition facts label. If it's a meal, estimate the nutrition for the visible portion as served. If it's a nutrition label, read it and report values for one typical serving (note the serving in the name).${kitchen}\nRespond ONLY with JSON: {"name": short descriptive name, "calories": number, "protein_g": number, "carbs_g": number, "fat_g": number}. No other text.`, 1000, 60000, b64);
      const j = parseJson(text);
      if (j && j.calories != null) setEstimate(j);
      else setError("Couldn't read that photo — try a clearer shot.");
    } catch (e) { setError(`Photo estimate failed — ${e.message}`); }
    setEstimating(false);
  };

  const logEstimate = (alsoSave) => {
    updateLog({ ...log, meals: [...log.meals, { ...estimate, id: Date.now() }] });
    if (alsoSave) updateLibrary([...library, { ...estimate, id: Date.now() + 1 }]);
    setEstimate(null); setMealText("");
  };

  const addManualWorkout = () => {
    const cals = Number(wCal);
    if (!cals) return;
    updateLog({ ...log, workouts: [...log.workouts, { id: Date.now(), name: "Workout", sport: "other", calories: cals, source: "manual" }] });
    setWCal(""); setManualOpen(false);
  };

  const removeItem = (kind, id) => updateLog({ ...log, [kind]: log[kind].filter((x) => x.id !== id) });

  return (
    <div>
      <Hero name={profile.name} targets={targets} eaten={eaten} macros={macros} trainingCals={log.workouts.reduce((s, w) => s + (Number(w.calories) || 0), 0)} />

      <Card>
        <Eyebrow right={
          <div style={{ display: "flex", gap: 7 }}>
            {stravaOn && <Btn small kind="ghost" icon="bolt" onClick={syncNow} disabled={syncing}>{syncing ? "Syncing…" : "Sync Strava"}</Btn>}
            <Btn small kind="ghost" icon="plus" onClick={() => setManualOpen(!manualOpen)}>Add training</Btn>
          </div>
        }>Training</Eyebrow>
        {log.workouts.length === 0 && !manualOpen && (
          <div style={{ fontSize: 13.5, color: C.faint }}>
            {stravaOn ? "Strava workouts sync automatically when you open the app — your target rises to match." : "Add your workout calories (from your watch or Strava) — your target rises to match."}
          </div>
        )}
        {trainMsg && <div style={{ fontSize: 12.5, color: C.faint, marginTop: 6 }}>{trainMsg}</div>}
        {log.workouts.map((w) => (
          <div key={w.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 0", borderTop: `1px solid ${C.line}` }}>
            <span style={{ color: C.pine, display: "inline-flex" }}><Icon d={ICONS.bolt} size={17} /></span>
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 600, fontSize: 14.5 }}>{w.name}</div>
              <div style={{ fontSize: 12, color: C.faint }}>{w.duration_min ? `${w.duration_min} min · ` : ""}{w.source}</div>
            </div>
            <span style={{ fontFamily: F.mono, fontSize: 14, fontWeight: 600, color: C.pine }}>+{Math.round(w.calories)}</span>
            <button onClick={() => removeItem("workouts", w.id)} style={{ border: "none", background: "none", color: C.faint, cursor: "pointer", padding: 4 }}><Icon d={ICONS.x} size={14} /></button>
          </div>
        ))}
        {manualOpen && (
          <div style={{ marginTop: 10, paddingTop: 12, borderTop: `1px solid ${C.line}`, display: "flex", gap: 8 }}>
            <input style={{ ...inputStyle, flex: 1 }} placeholder="Calories burned, e.g. 350" inputMode="numeric" value={wCal} onChange={(e) => setWCal(e.target.value)} />
            <Btn small onClick={addManualWorkout} disabled={!Number(wCal)}>Add</Btn>
          </div>
        )}
      </Card>

      <Card>
        <Eyebrow>Log a meal</Eyebrow>
        <React.Fragment>
            <textarea style={{ ...inputStyle, minHeight: 62, resize: "vertical" }} placeholder='"Office chicken burrito bowl, no rice, extra beans"' value={mealText} onChange={(e) => setMealText(e.target.value)} />
            <div style={{ marginTop: 10, display: "flex", gap: 8 }}>
              <div style={{ flex: 1 }}>
                <Btn icon="spark" onClick={estimateMeal} disabled={estimating || !mealText.trim() || !aiReady} full>
                  {estimating ? "Estimating…" : "Estimate macros"}
                </Btn>
              </div>
              <label style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", width: 50, borderRadius: 12, cursor: estimating ? "default" : "pointer", border: `1.5px solid ${C.pine}`, color: C.pine, opacity: estimating || !aiReady ? 0.45 : 1 }} title="Snap a meal or nutrition label">
                <Icon d={ICONS.camera} size={20} />
                <input type="file" accept="image/*" capture="environment" style={{ display: "none" }} disabled={estimating || !aiReady}
                  onChange={(e) => { estimatePhoto(e.target.files && e.target.files[0]); e.target.value = ""; }} />
              </label>
            </div>
            <div style={{ marginTop: 7, fontSize: 12, color: C.faint }}>Type it, or snap a photo of the plate or the nutrition label.</div>
            {estimate && (
              <div style={{ marginTop: 12, padding: 14, background: C.pineSoft, borderRadius: 14 }}>
                <div style={{ fontWeight: 700, fontSize: 15 }}>{estimate.name}</div>
                <div style={{ fontFamily: F.mono, fontSize: 13.5, margin: "5px 0 11px", color: C.pine, fontWeight: 600 }}>
                  {estimate.calories} kcal · P {estimate.protein_g} · C {estimate.carbs_g} · F {estimate.fat_g}
                </div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <Btn small onClick={() => logEstimate(false)}>Log it</Btn>
                  <Btn small kind="ghost" onClick={() => logEstimate(true)}>Log + save to Library</Btn>
                  <Btn small kind="ghost" onClick={() => setEstimate(null)}>Discard</Btn>
                </div>
              </div>
            )}
          </React.Fragment>
        {error && <div style={{ marginTop: 10, fontSize: 13, color: C.red }}>{error}</div>}
      </Card>

      <Card>
        <Eyebrow>Eaten today</Eyebrow>
        {log.meals.length === 0 && <div style={{ fontSize: 13.5, color: C.faint }}>Nothing yet — log above or tap your Library.</div>}
        {log.meals.map((m) => (
          <div key={m.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 0", borderTop: `1px solid ${C.line}` }}>
            <div style={{ flex: 1, fontWeight: 600, fontSize: 14.5 }}>{m.name}</div>
            <span style={{ fontFamily: F.mono, fontSize: 13, color: C.faint, whiteSpace: "nowrap" }}>{m.calories} · P{m.protein_g}</span>
            <button onClick={() => removeItem("meals", m.id)} style={{ border: "none", background: "none", color: C.faint, cursor: "pointer", padding: 4 }}><Icon d={ICONS.x} size={14} /></button>
          </div>
        ))}
      </Card>
    </div>
  );
}

/* ============ Suggest ============ */
function SuggestTab({ profile, targets, eaten, macros, log, updateLog, library, updateLibrary, aiReady }) {
  const [mode, setMode] = useState("ideas");
  const [suggestText, setSuggestText] = useState("");
  const [suggestions, setSuggestions] = useState(null);
  const [menuText, setMenuText] = useState("");
  const [menuPicks, setMenuPicks] = useState(null);
  const [thinking, setThinking] = useState(false);
  const [error, setError] = useState("");

  const remaining = targets.calories - eaten;
  const proteinLeft = Math.max(targets.protein - macros.protein, 0);
  const kitchen = profile.kitchenNotes?.trim()
    ? `\nStanding kitchen facts — always apply these when relevant: ${profile.kitchenNotes.trim()}` : "";

  const getSuggestions = async () => {
    setThinking(true); setError(""); setSuggestions(null);
    try {
      const text = await askClaude(`Request: ${suggestText.trim() || "a snack"}. I have ~${Math.max(remaining, 0)} kcal and ${proteinLeft}g protein left today; I'm cutting while keeping muscle, so prioritize closing the protein gap. Suggest 3 options sized to fit my remaining budget. Prefer minimal-prep, common-ingredient options unless the request implies cooking.${kitchen}\nRespond ONLY with compact JSON: {"suggestions":[{"name": short name, "desc": very short how-to or note, "calories": number, "protein_g": number, "carbs_g": number, "fat_g": number}]}. No other text.`, 1200);
      const j = parseJson(text);
      if (j && j.suggestions) setSuggestions(j.suggestions);
      else setError("Couldn't get suggestions — try again.");
    } catch (e) { setError(`Suggestion failed — ${e.message}`); }
    setThinking(false);
  };

  const analyzeMenu = async () => {
    if (!menuText.trim()) return;
    setThinking(true); setError(""); setMenuPicks(null);
    try {
      const text = await askClaude(`Menu:\n${menuText}\n\nI have ~${Math.max(remaining, 0)} kcal and ${proteinLeft}g protein left today; cutting while keeping muscle. Rank the 3 best options.${kitchen}\nRespond ONLY with JSON: {"picks":[{"item": name, "why": very short phrase, "calories": number, "protein_g": number, "carbs_g": number, "fat_g": number}]}. No other text.`);
      const j = parseJson(text);
      if (j && j.picks) setMenuPicks(j.picks);
      else setError("Couldn't rank that menu — paste it as plain text.");
    } catch (e) { setError(`Menu ranking failed — ${e.message}`); }
    setThinking(false);
  };

  const seg = (key, label) => (
    <button onClick={() => { setMode(key); setError(""); setSuggestions(null); setMenuPicks(null); }} style={{
      flex: 1, padding: "9px 0", borderRadius: 10, border: "none", cursor: "pointer",
      background: mode === key ? C.surface : "transparent",
      color: mode === key ? C.ink : C.faint,
      fontFamily: F.body, fontWeight: 600, fontSize: 13,
      boxShadow: mode === key ? "0 1px 3px rgba(24,32,25,0.12)" : "none",
    }}>{label}</button>
  );

  return (
    <div>
      <Card>
        <div style={{ display: "flex", gap: 4, background: C.bg, borderRadius: 12, padding: 4, marginBottom: 12 }}>
          {seg("ideas", "Ideas")}
          {seg("menu", "Menu suggest")}
        </div>

        {mode === "ideas" && (
          <React.Fragment>
            <input style={inputStyle} placeholder='"Snack", "breakfast", "something sweet"…' value={suggestText}
              onChange={(e) => setSuggestText(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") getSuggestions(); }} />
            <div style={{ marginTop: 10 }}>
              <Btn icon="spark" onClick={getSuggestions} disabled={thinking || !aiReady} full>
                {thinking ? "Thinking…" : `Suggest for ${Math.max(remaining, 0)} kcal · ${proteinLeft}g protein left`}
              </Btn>
            </div>
            {suggestions && suggestions.map((s, i) => (
              <div key={i} style={{ marginTop: 10, padding: 13, borderRadius: 14, background: i === 0 ? C.pineSoft : "#FBFBF8", border: i === 0 ? "none" : `1px solid ${C.line}` }}>
                <div style={{ fontWeight: 700, fontSize: 14.5 }}>{s.name}</div>
                <div style={{ fontSize: 13, color: C.faint, margin: "3px 0 8px" }}>{s.desc}</div>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <span style={{ fontFamily: F.mono, fontSize: 13, fontWeight: 600, color: C.pine }}>{s.calories} kcal · P {s.protein_g}</span>
                  <div style={{ display: "flex", gap: 6 }}>
                    <Btn small kind="ghost" onClick={() => updateLibrary([...library, { ...s, id: Date.now() }])}>Save</Btn>
                    <Btn small onClick={() => { updateLog({ ...log, meals: [...log.meals, { ...s, id: Date.now() }] }); setSuggestions(null); }}>Log it</Btn>
                  </div>
                </div>
              </div>
            ))}
          </React.Fragment>
        )}

        {mode === "menu" && (
          <React.Fragment>
            <textarea style={{ ...inputStyle, minHeight: 92, resize: "vertical" }} placeholder="Paste a menu — office cafeteria, restaurant, takeout…" value={menuText} onChange={(e) => setMenuText(e.target.value)} />
            <div style={{ marginTop: 10 }}>
              <Btn icon="spark" onClick={analyzeMenu} disabled={thinking || !menuText.trim() || !aiReady} full>
                {thinking ? "Ranking…" : `Best picks for ${Math.max(remaining, 0)} kcal left`}
              </Btn>
            </div>
            {menuPicks && menuPicks.map((p, i) => (
              <div key={i} style={{ marginTop: 10, padding: 13, borderRadius: 14, background: i === 0 ? C.pineSoft : "#FBFBF8", border: i === 0 ? "none" : `1px solid ${C.line}` }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 8 }}>
                  <div style={{ fontWeight: 700, fontSize: 14.5 }}>{p.item}</div>
                  {i === 0 && <Pill>Top pick</Pill>}
                </div>
                <div style={{ fontSize: 13, color: C.faint, margin: "3px 0 8px" }}>{p.why}</div>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <span style={{ fontFamily: F.mono, fontSize: 13, fontWeight: 600, color: C.pine }}>{p.calories} kcal · P {p.protein_g}</span>
                  <Btn small kind="ghost" onClick={() => {
                    updateLog({ ...log, meals: [...log.meals, { name: p.item, calories: p.calories, protein_g: p.protein_g, carbs_g: p.carbs_g, fat_g: p.fat_g, id: Date.now() }] });
                    setMenuPicks(null); setMenuText("");
                  }}>Log this</Btn>
                </div>
              </div>
            ))}
          </React.Fragment>
        )}
        {error && <div style={{ marginTop: 10, fontSize: 13, color: C.red }}>{error}</div>}
      </Card>
      <div style={{ fontSize: 13, color: C.faint, textAlign: "center", padding: "0 18px", lineHeight: 1.5 }}>
        Sized to what's left of today's budget — log meals first for sharper suggestions.
      </div>
    </div>
  );
}

/* ============ Plan ============ */
const DINNER_JSON = `{"name": str, "style": "batch" or "fresh", "desc": one short sentence, "calories": per serving, "protein_g": num, "highlights": [2-3 very short "Label · detail" strings showing how it meets the priorities], "ingredients": [str with quantities]}`;

function PlanTab({ profile, targets, plan, updatePlan, aiReady, prefs, updatePrefs }) {
  const [nights, setNights] = useState(4);
  const [notes, setNotes] = useState("");
  const [newTag, setNewTag] = useState("");
  const [busy, setBusy] = useState(false);
  const [swapping, setSwapping] = useState(null);
  const [adjustOpen, setAdjustOpen] = useState(null);
  const [adjustText, setAdjustText] = useState("");
  const [adjusting, setAdjusting] = useState(null);
  const [openRecipe, setOpenRecipe] = useState(null);
  const [recipeBusy, setRecipeBusy] = useState(null);
  const [error, setError] = useState("");

  const remember = (names) => {
    const h = [...loadKey("dinner-history", []), ...names].slice(-40);
    saveKey("dinner-history", h);
  };

  const constraints = (avoid) => {
    const recent = loadKey("dinner-history", []);
    return `- Cook is cutting at ~${targets.calories} kcal/day, ${targets.protein}g protein/day; dinners 550-700 kcal/serving.
${prefs.length ? `- Priorities for every dinner: ${prefs.join("; ")}.` : ""}
${profile.kitchenNotes?.trim() ? `- Standing kitchen facts — apply when relevant: ${profile.kitchenNotes.trim()}` : ""}
${avoid && avoid.length ? `- NEVER suggest these rejected meals or close variants: ${avoid.join("; ")}.` : ""}
${recent.length ? `- Recently planned — do NOT repeat these or close variants; aim for genuinely different cuisines and proteins: ${recent.slice(-24).join("; ")}.` : ""}`;
  };

  const addTag = () => {
    const t = newTag.trim();
    if (!t) return;
    if (!prefs.some((p) => p.toLowerCase() === t.toLowerCase())) updatePrefs([...prefs, t]);
    setNewTag("");
  };

  const toggleRecipe = async (idx) => {
    if (openRecipe === idx) { setOpenRecipe(null); return; }
    setOpenRecipe(idx);
    const d = plan.dinners[idx];
    if (d.recipe) return;
    setRecipeBusy(idx);
    try {
      const text = await askClaude(`Write a concise recipe for "${d.name}" — ${d.desc}. ${d.style === "batch" ? "4 servings (dinner for two plus leftovers)" : "2 servings"}. Use these ingredients: ${JSON.stringify(d.ingredients)}. Keep it high-protein, low saturated fat. Respond ONLY with compact JSON: {"time_min": total number, "servings": number, "steps": [max 8 short imperative steps]}. No other text.`, 1500);
      const j = parseJson(text);
      if (j && j.steps) updatePlan({ ...plan, dinners: plan.dinners.map((x, i) => (i === idx ? { ...x, recipe: j } : x)) });
      else setError("Couldn't load that recipe — tap again to retry.");
    } catch (e) { setError(`Recipe load failed — ${e.message}`); }
    setRecipeBusy(null);
  };

  const swapDinner = async (idx) => {
    setSwapping(idx); setError("");
    const rejectedMeal = plan.dinners[idx];
    const keeping = plan.dinners.filter((_, i) => i !== idx);
    const rejected = [...(plan.rejected || []), rejectedMeal.name].slice(-20);
    try {
      const text = await askClaude(`I'm replacing one dinner in a weekly plan for two adults. Constraints:
${constraints(rejected)}
Keeping these dinners (with their ingredients): ${JSON.stringify(keeping.map((d) => ({ name: d.name, style: d.style, ingredients: d.ingredients })))}
Suggest ONE new dinner, different from everything above, style "${rejectedMeal.style}". Then rebuild the consolidated shopping list covering the new dinner plus ALL kept dinners.
Respond ONLY with compact single-line JSON: {"dinner":${DINNER_JSON}, "shopping_list":[{"category": str, "items": [str]}]}. No other text.`, 4000);
      const j = parseJson(text);
      if (j && j.dinner) {
        updatePlan({ ...plan, dinners: plan.dinners.map((d, i) => (i === idx ? j.dinner : d)), shopping_list: j.shopping_list || plan.shopping_list, rejected });
        remember([j.dinner.name]);
      } else setError("Couldn't find a swap — try again.");
    } catch (e) { setError(`Swap failed — ${e.message}`); }
    setSwapping(null);
  };

  const adjustDinner = async (idx) => {
    const change = adjustText.trim();
    if (!change) return;
    setAdjusting(idx); setError("");
    const d = plan.dinners[idx];
    const keeping = plan.dinners.filter((_, i) => i !== idx);
    try {
      const text = await askClaude(`Revise ONE dinner in a weekly plan for two adults. Constraints:
${constraints(plan.rejected)}
Current dinner: ${JSON.stringify({ name: d.name, style: d.style, desc: d.desc, ingredients: d.ingredients })}
Requested change: "${change}". Apply it while keeping the dinner as close to the original as makes sense, same style "${d.style}".
Other dinners staying (with their ingredients): ${JSON.stringify(keeping.map((x) => ({ name: x.name, ingredients: x.ingredients })))}
Then rebuild the consolidated shopping list covering the revised dinner plus ALL other dinners.
Respond ONLY with compact single-line JSON: {"dinner":${DINNER_JSON}, "shopping_list":[{"category": str, "items": [str]}]}. No other text.`, 4000);
      const j = parseJson(text);
      if (j && j.dinner) {
        updatePlan({ ...plan, dinners: plan.dinners.map((x, i) => (i === idx ? j.dinner : x)), shopping_list: j.shopping_list || plan.shopping_list });
        remember([j.dinner.name]);
        setAdjustOpen(null); setAdjustText("");
      } else setError("Couldn't apply that change — try rewording it.");
    } catch (e) { setError(`Adjustment failed — ${e.message}`); }
    setAdjusting(null);
  };

  const generate = async () => {
    setBusy(true); setError("");
    try {
      const text = await askClaude(`Plan ${nights} dinners for two adults. Constraints:
${constraints(plan && plan.rejected)}
- Roughly half batch-friendly, half quick fresh. Vary cuisines and proteins across the week.
${notes ? `- Extra requests: ${notes}` : ""}
Respond ONLY with compact single-line JSON (no extra whitespace): {"dinners":[${DINNER_JSON}], "shopping_list":[{"category": str, "items": [str]}]}. Consolidate the shopping list. No other text.`, 4000);
      const j = parseJson(text);
      if (j && j.dinners) {
        updatePlan({ ...j, week: todayKey(), checked: [], rejected: (plan && plan.rejected) || [] });
        remember(j.dinners.map((d) => d.name));
      } else setError("Couldn't generate — try again.");
    } catch (e) { setError(`Plan generation failed — ${e.message}`); }
    setBusy(false);
  };

  const toggleCheck = (item) => {
    const checked = plan.checked && plan.checked.includes(item)
      ? plan.checked.filter((i) => i !== item)
      : [...((plan && plan.checked) || []), item];
    updatePlan({ ...plan, checked });
  };

  const copyList = () => {
    const txt = plan.shopping_list.map((c) => `${c.category}\n${c.items.map((i) => `  - ${i}`).join("\n")}`).join("\n");
    if (navigator.clipboard) navigator.clipboard.writeText(txt);
  };

  return (
    <div>
      <Card>
        <Eyebrow>Dinner plan</Eyebrow>
        <Group label="Nights this week">
          <div style={{ display: "flex", gap: 8 }}>
            {[3, 4, 5, 6].map((n) => (
              <button key={n} onClick={() => setNights(n)} style={{
                flex: 1, height: 44, borderRadius: 12, cursor: "pointer",
                border: `1.5px solid ${nights === n ? C.pine : C.line}`,
                background: nights === n ? C.pine : "#FBFBF8",
                color: nights === n ? "#FFF" : C.ink,
                fontFamily: F.display, fontWeight: 800, fontSize: 16,
              }}>{n}</button>
            ))}
          </div>
        </Group>
        <Field label="Requests (optional)">
          <input style={inputStyle} placeholder='"Use up the salmon in the freezer"' value={notes} onChange={(e) => setNotes(e.target.value)} />
        </Field>
        <Group label="Priorities — every dinner honors these">
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: prefs.length ? 10 : 0 }}>
            {prefs.map((t) => (
              <span key={t} style={{ display: "inline-flex", alignItems: "center", gap: 4, fontSize: 11.5, fontWeight: 700, padding: "4px 6px 4px 10px", borderRadius: 999, background: C.pineSoft, color: C.pine }}>
                {t}
                <button onClick={() => updatePrefs(prefs.filter((x) => x !== t))} aria-label={`Remove ${t}`}
                  style={{ border: "none", background: "none", color: C.pine, cursor: "pointer", padding: 2, display: "inline-flex" }}>
                  <Icon d={ICONS.x} size={11} sw={2.4} />
                </button>
              </span>
            ))}
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <input style={{ ...inputStyle, flex: 1 }} placeholder='Add one — "Mediterranean", "low sodium"…' value={newTag}
              onChange={(e) => setNewTag(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") addTag(); }} />
            <Btn small kind="ghost" icon="plus" onClick={addTag} disabled={!newTag.trim()}>Add</Btn>
          </div>
        </Group>
        <Btn full icon="spark" onClick={generate} disabled={busy || !aiReady}>
          {busy ? "Planning…" : plan ? "Regenerate plan" : "Generate plan"}
        </Btn>
        {error && <div style={{ marginTop: 10, fontSize: 13, color: C.red }}>{error}</div>}
      </Card>

      {plan && plan.dinners && plan.dinners.map((d, i) => (
        <Card key={i} style={{ padding: 15, opacity: swapping === i || adjusting === i ? 0.55 : 1 }}>
          <div onClick={() => toggleRecipe(i)} style={{ cursor: "pointer" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <div style={{ fontFamily: F.display, fontWeight: 700, fontSize: 16 }}>{d.name}</div>
                <span style={{ color: C.faint, display: "inline-flex", transform: openRecipe === i ? "rotate(180deg)" : "none" }}><Icon d={ICONS.chevron} size={16} /></span>
              </div>
              <Pill tone={d.style === "batch" ? "pine" : "amber"}>{d.style === "batch" ? "Batch · leftovers" : "Fresh · quick"}</Pill>
            </div>
            <div style={{ fontSize: 13, color: C.faint, margin: "4px 0 9px", lineHeight: 1.45 }}>{d.desc}</div>
          </div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
            <span style={{ fontFamily: F.mono, fontSize: 13, fontWeight: 600, color: C.pine, marginRight: 4 }}>{d.calories} kcal · P {d.protein_g}g</span>
            {(d.highlights || [d.iron_note && `Iron · ${d.iron_note}`, d.heart_note && `Heart · ${d.heart_note}`].filter(Boolean)).map((h, k) => (
              <Pill key={k}>{h}</Pill>
            ))}
            <span style={{ marginLeft: "auto", display: "flex", gap: 6 }}>
              <Btn small kind="ghost" icon="sliders" onClick={() => { setAdjustOpen(adjustOpen === i ? null : i); setAdjustText(""); }}
                disabled={swapping !== null || adjusting !== null || busy || !aiReady}>Tweak</Btn>
              <Btn small kind="ghost" icon="swap" onClick={() => swapDinner(i)} disabled={swapping !== null || adjusting !== null || busy || !aiReady}>
                {swapping === i ? "Swapping…" : "Not for me"}
              </Btn>
            </span>
          </div>
          {adjustOpen === i && (
            <div style={{ marginTop: 10, display: "flex", gap: 8 }}>
              <input style={{ ...inputStyle, flex: 1 }} placeholder={'"I don\'t have kale", "swap pork for chicken"…'} value={adjustText}
                onChange={(e) => setAdjustText(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") adjustDinner(i); }} />
              <Btn small onClick={() => adjustDinner(i)} disabled={!adjustText.trim() || adjusting !== null || swapping !== null || busy}>
                {adjusting === i ? "Fixing…" : "Apply"}
              </Btn>
            </div>
          )}
          {openRecipe === i && (
            <div style={{ marginTop: 12, paddingTop: 12, borderTop: `1px solid ${C.line}` }}>
              {recipeBusy === i && <div style={{ fontSize: 13, color: C.faint }}>Loading recipe…</div>}
              {d.recipe && (
                <React.Fragment>
                  <div style={{ fontFamily: F.mono, fontSize: 12.5, color: C.faint, marginBottom: 10 }}>{d.recipe.time_min} min · serves {d.recipe.servings}</div>
                  <div style={{ fontSize: 11.5, fontWeight: 600, letterSpacing: "0.09em", textTransform: "uppercase", color: C.faint, marginBottom: 5 }}>Ingredients</div>
                  <div style={{ fontSize: 13.5, lineHeight: 1.7, marginBottom: 12 }}>{d.ingredients && d.ingredients.join(" · ")}</div>
                  <div style={{ fontSize: 11.5, fontWeight: 600, letterSpacing: "0.09em", textTransform: "uppercase", color: C.faint, marginBottom: 5 }}>Steps</div>
                  {d.recipe.steps.map((s, k) => (
                    <div key={k} style={{ display: "flex", gap: 10, padding: "5px 0", fontSize: 13.5, lineHeight: 1.5 }}>
                      <span style={{ fontFamily: F.mono, fontWeight: 600, color: C.pine, flexShrink: 0 }}>{k + 1}</span>
                      <span>{s}</span>
                    </div>
                  ))}
                </React.Fragment>
              )}
            </div>
          )}
        </Card>
      ))}

      {plan && plan.shopping_list && (
        <Card>
          <Eyebrow right={<Btn small kind="ghost" icon="copy" onClick={copyList}>Copy</Btn>}>Shopping list</Eyebrow>
          {plan.shopping_list.map((cat, i) => (
            <div key={i} style={{ marginBottom: 8 }}>
              <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase", color: C.faint, margin: "9px 0 4px" }}>{cat.category}</div>
              {cat.items.map((item, j) => {
                const done = plan.checked && plan.checked.includes(item);
                return (
                  <div key={j} onClick={() => toggleCheck(item)} style={{
                    display: "flex", alignItems: "center", gap: 10, padding: "7px 0", cursor: "pointer", fontSize: 14.5,
                    color: done ? C.faint : C.ink, textDecoration: done ? "line-through" : "none",
                  }}>
                    <span style={{
                      width: 19, height: 19, borderRadius: 6, flexShrink: 0,
                      border: `1.5px solid ${done ? C.pine : "#CFCEC4"}`,
                      background: done ? C.pine : "#FFF",
                      display: "inline-flex", alignItems: "center", justifyContent: "center", color: "#FFF",
                    }}>{done && <Icon d={ICONS.check} size={12} sw={2.6} />}</span>
                    {item}
                  </div>
                );
              })}
            </div>
          ))}
        </Card>
      )}

      {!plan && <div style={{ fontSize: 13.5, color: C.faint, textAlign: "center", padding: 18 }}>Pick your nights and generate a plan.</div>}
    </div>
  );
}

/* ============ Library ============ */
function LibraryTab({ library, updateLibrary, log, updateLog }) {
  return (
    <div>
      <Card>
        <Eyebrow>Meal library</Eyebrow>
        <div style={{ fontSize: 13.5, color: C.faint }}>Repeat meals, one-tap logging.</div>
      </Card>
      {library.length === 0 && (
        <div style={{ fontSize: 13.5, color: C.faint, textAlign: "center", padding: 18, lineHeight: 1.5 }}>
          Estimate a meal on Today, then "Log + save to Library."
        </div>
      )}
      {library.map((m) => (
        <Card key={m.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: 14 }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 700, fontSize: 14.5 }}>{m.name}</div>
            <div style={{ fontFamily: F.mono, fontSize: 12, color: C.faint, marginTop: 2 }}>{m.calories} kcal · P {m.protein_g} · C {m.carbs_g} · F {m.fat_g}</div>
          </div>
          <Btn small onClick={() => updateLog({ ...log, meals: [...log.meals, { ...m, id: Date.now() }] })}>Log</Btn>
          <button onClick={() => updateLibrary(library.filter((x) => x.id !== m.id))} style={{ border: "none", background: "none", color: C.faint, cursor: "pointer", padding: 6 }}><Icon d={ICONS.x} size={15} /></button>
        </Card>
      ))}
    </div>
  );
}

/* ============ Settings ============ */
function SettingsTab({ profile, updateProfile, firstRun, done, appData, onRestore, apiKey, updateApiKey, strava, updateStrava, stravaMsg }) {
  const [p, setP] = useState(profile);
  const [saveErr, setSaveErr] = useState("");
  useEffect(() => { setP(profile); }, [profile]);
  const set = (k, v) => setP({ ...p, [k]: v });
  const num = (v) => (v === "" ? "" : Number(v));

  const save = () => {
    setSaveErr("");
    const clean = {
      ...p,
      age: Number(p.age) || 30,
      heightFt: Number(p.heightFt) || 5,
      heightIn: Number(p.heightIn) || 0,
      weightLb: Number(p.weightLb) || 150,
      rateLbWk: Number(p.rateLbWk) || 0,
    };
    updateProfile(clean);
    if (saveKey("profile", clean)) done();
    else setSaveErr("Couldn't save — your browser may be blocking site storage (private browsing?).");
  };

  return (
    <div>
      {firstRun && (
        <Card style={{ background: `linear-gradient(150deg, ${C.forestUp}, ${C.forest})`, border: "none", color: "#FFF" }}>
          <div style={{ fontFamily: F.display, fontWeight: 800, fontSize: 17 }}>Welcome to OnPace</div>
          <div style={{ fontSize: 13.5, color: C.mintDim, marginTop: 4 }}>Set your numbers — anyone you share this with sets their own.</div>
        </Card>
      )}
      <Card>
        <Eyebrow>Profile</Eyebrow>
        <Field label="Name (optional)">
          <input style={inputStyle} value={p.name} onChange={(e) => set("name", e.target.value)} placeholder="Who's tracking" />
        </Field>
        <div style={{ display: "flex", gap: 10 }}>
          <div style={{ flex: 1.4 }}>
            <Field label="Sex (for BMR)">
              <select style={inputStyle} value={p.sex} onChange={(e) => set("sex", e.target.value)}>
                <option value="male">Male</option>
                <option value="female">Female</option>
              </select>
            </Field>
          </div>
          <div style={{ flex: 1 }}>
            <Field label="Age"><input style={inputStyle} inputMode="numeric" value={p.age} onChange={(e) => set("age", num(e.target.value))} /></Field>
          </div>
        </div>
        <div style={{ display: "flex", gap: 10 }}>
          <div style={{ flex: 1 }}><Field label="Height (ft)"><input style={inputStyle} inputMode="numeric" value={p.heightFt} onChange={(e) => set("heightFt", num(e.target.value))} /></Field></div>
          <div style={{ flex: 1 }}><Field label="Height (in)"><input style={inputStyle} inputMode="numeric" value={p.heightIn} onChange={(e) => set("heightIn", num(e.target.value))} /></Field></div>
          <div style={{ flex: 1 }}><Field label="Weight (lb)"><input style={inputStyle} inputMode="numeric" value={p.weightLb} onChange={(e) => set("weightLb", num(e.target.value))} /></Field></div>
        </div>
        <Field label={p.rateLbWk > 0 ? `Goal — lose ${p.rateLbWk} lb/week` : "Goal — maintain weight"}>
          <input type="range" min="0" max="1.5" step="0.25" value={p.rateLbWk} onChange={(e) => set("rateLbWk", Number(e.target.value))} style={{ width: "100%", accentColor: C.pine }} />
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: C.faint, marginTop: 2 }}>
            <span>Maintain</span><span>Moderate</span><span>1.5 lb/wk</span>
          </div>
        </Field>
        <Field label="Kitchen facts">
          <textarea style={{ ...inputStyle, minHeight: 76, resize: "vertical" }}
            placeholder={'Standing truths about your kitchen, one per line — e.g. "Protein shakes always use 2 scoops Orgain Organic vanilla."'}
            value={p.kitchenNotes || ""} onChange={(e) => set("kitchenNotes", e.target.value)} />
          <div style={{ fontSize: 12, color: C.faint, marginTop: 4 }}>Applied automatically to meal estimates, suggestions, and dinner plans.</div>
        </Field>
        <Btn full onClick={save}>Save profile</Btn>
        {saveErr && <div style={{ marginTop: 9, fontSize: 13, color: C.red }}>{saveErr}</div>}
      </Card>
      <AiCard apiKey={apiKey} updateApiKey={updateApiKey} />
      <StravaCard strava={strava} updateStrava={updateStrava} msg={stravaMsg} />
      <BackupCard appData={appData} onRestore={onRestore} />
      <Card>
        <div style={{ fontSize: 13, color: C.faint, lineHeight: 1.6 }}>
          Targets use Mifflin-St Jeor plus your logged training. Protein holds at ~0.9g/lb to protect muscle; calories
          never drop below a safe floor. If the scale disagrees over 2–3 weeks, nudge the goal slider. Data lives in
          this browser only — Export a backup occasionally, and use it to move between devices.
        </div>
        <div style={{ fontSize: 11.5, color: C.faint, marginTop: 10, fontFamily: F.mono }}>Build {APP_BUILD}</div>
      </Card>
    </div>
  );
}

function AiCard({ apiKey, updateApiKey }) {
  const [draft, setDraft] = useState(apiKey);
  const [msg, setMsg] = useState("");
  useEffect(() => { setDraft(apiKey); }, [apiKey]);
  const save = () => {
    const k = draft.trim();
    updateApiKey(k);
    setMsg(k ? "Key saved on this device — AI features are on." : "Key removed — AI features are off.");
  };
  return (
    <Card>
      <Eyebrow right={apiKey ? <Pill>On</Pill> : <Pill tone="amber">Off</Pill>}>AI features</Eyebrow>
      <Field label="Anthropic API key">
        <input style={inputStyle} type="password" autoComplete="off" placeholder="sk-ant-…"
          value={draft} onChange={(e) => setDraft(e.target.value)} />
      </Field>
      <div style={{ display: "flex", gap: 8 }}>
        <Btn small onClick={save} disabled={draft.trim() === apiKey}>Save key</Btn>
        {apiKey && <Btn small kind="ghost" onClick={() => { setDraft(""); updateApiKey(""); setMsg("Key removed — AI features are off."); }}>Remove</Btn>}
      </div>
      {msg && <div style={{ marginTop: 8, fontSize: 12.5, color: C.faint }}>{msg}</div>}
      <div style={{ fontSize: 12, color: C.faint, marginTop: 10, lineHeight: 1.55 }}>
        Powers meal estimates, photo reading, menu ranking, and dinner plans. Create a key at
        console.anthropic.com → API Keys (needs a little billing credit; typical use is $1–3/month).
        The key stays in this browser on this device — it's never in the app's code and isn't included
        in backups, so re-enter it if you move to a new phone. Anyone you share the app's URL with
        uses their own key.
      </div>
    </Card>
  );
}

function StravaCard({ strava, updateStrava, msg }) {
  const [cid, setCid] = useState((strava && strava.clientId) || "");
  const [secret, setSecret] = useState((strava && strava.clientSecret) || "");
  const [note, setNote] = useState("");
  useEffect(() => {
    setCid((strava && strava.clientId) || "");
    setSecret((strava && strava.clientSecret) || "");
  }, [strava]);
  const connected = !!(strava && strava.refreshToken);

  const connect = () => {
    const id = cid.trim(), sec = secret.trim();
    if (!id || !sec) { setNote("Enter both the Client ID and Client Secret first."); return; }
    updateStrava({ ...(strava || {}), clientId: id, clientSecret: sec });
    const redirect = window.location.origin + window.location.pathname;
    window.location.href = `${STRAVA_AUTH}?client_id=${encodeURIComponent(id)}&redirect_uri=${encodeURIComponent(redirect)}&response_type=code&approval_prompt=auto&scope=activity:read_all`;
  };
  const disconnect = () => {
    updateStrava({ clientId: cid.trim(), clientSecret: secret.trim() });
    setNote("Disconnected — your Strava API app credentials are kept.");
  };

  return (
    <Card>
      <Eyebrow right={connected ? <Pill>Connected</Pill> : <Pill tone="amber">Off</Pill>}>Strava</Eyebrow>
      {connected ? (
        <React.Fragment>
          <div style={{ fontSize: 13.5, marginBottom: 10 }}>
            Connected{strava.athlete ? ` as ${strava.athlete}` : ""}. Today's workouts sync automatically whenever you open the app;
            "Sync Strava" on the Today tab re-checks instantly.
          </div>
          <Btn small kind="ghost" onClick={disconnect}>Disconnect</Btn>
        </React.Fragment>
      ) : (
        <React.Fragment>
          <Field label="Client ID">
            <input style={inputStyle} inputMode="numeric" autoComplete="off" placeholder="e.g. 123456" value={cid} onChange={(e) => setCid(e.target.value)} />
          </Field>
          <Field label="Client Secret">
            <input style={inputStyle} type="password" autoComplete="off" placeholder="from your Strava API app" value={secret} onChange={(e) => setSecret(e.target.value)} />
          </Field>
          <Btn small onClick={connect}>Connect Strava</Btn>
        </React.Fragment>
      )}
      {(note || msg) && <div style={{ marginTop: 8, fontSize: 12.5, color: C.faint }}>{note || msg}</div>}
      <div style={{ fontSize: 12, color: C.faint, marginTop: 10, lineHeight: 1.55 }}>
        One-time: create your own free Strava API app at strava.com/settings/api — set "Authorization
        Callback Domain" to <span style={{ fontFamily: F.mono }}>{window.location.hostname || "your app's domain"}</span>,
        then copy its Client ID and Client Secret here and tap Connect. Do this inside the installed app
        (not a separate Safari tab). Like your AI key, these stay in this browser on this device and are
        not included in backups.
      </div>
    </Card>
  );
}

function BackupCard({ appData, onRestore }) {
  const [text, setText] = useState("");
  const [msg, setMsg] = useState("");
  const doExport = () => {
    const blob = JSON.stringify(appData);
    setText(blob);
    if (navigator.clipboard) navigator.clipboard.writeText(blob);
    setMsg("Backup copied to clipboard — paste it somewhere safe (Notes works).");
  };
  const doImport = () => {
    try {
      const d = JSON.parse(text);
      if (!d || typeof d !== "object") throw new Error();
      onRestore(d);
      setMsg("Restored and saved.");
    } catch { setMsg("That doesn't look like a valid backup — paste the exact exported text."); }
  };
  return (
    <Card>
      <Eyebrow right={
        <div style={{ display: "flex", gap: 7 }}>
          <Btn small kind="ghost" onClick={doExport}>Export</Btn>
          <Btn small onClick={doImport} disabled={!text.trim()}>Restore</Btn>
        </div>
      }>Backup</Eyebrow>
      <textarea style={{ ...inputStyle, minHeight: 64, resize: "vertical", fontFamily: F.mono, fontSize: 11.5 }}
        placeholder="Export puts your data here (and on the clipboard). Paste a backup here and tap Restore to load it."
        value={text} onChange={(e) => setText(e.target.value)} />
      {msg && <div style={{ marginTop: 8, fontSize: 12.5, color: C.faint }}>{msg}</div>}
    </Card>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
